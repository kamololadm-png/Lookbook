<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lollipop's Lookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
</head>
<body>

  <!-- ───────────── HEADER ───────────── -->
  <header class="film-header">
    <a href="index.html" class="logo">LOLLIPOP<sup>&reg;</sup></a>
    <div class="film-title">
      <span class="film-title-main">CASUAL</span>
    </div>
    <nav class="film-nav">
      <a href="index.html#looks">LOOKS</a>
      <a href="index.html#about">ABOUT</a>
    </nav>
  </header>

  <main class="filmstrip-viewport" id="filmstripViewport">
    <div class="filmstrip-track" id="filmstripTrack">

      <div class="frame">
        <img src="./assets/vintage1.jpg" alt="Vintage look 1">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage2.jpg" alt="Vintage look 2">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage3.jpg" alt="Vintage look 3">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage4.jpg" alt="Vintage look 4">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage5.jpg" alt="Vintage look 5">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage6.jpg" alt="Vintage look 6">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage7.jpg" alt="Vintage look 7">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

      <div class="frame">
        <img src="./assets/vintage8.jpg" alt="Vintage look 8">
        <span class="frame-zoom-label">ZOOM IN</span>
      </div>

    </div>
  </main>

<!-- ───────────── FOOTER ───────────── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">LOLLIPOP</span>
      <span class="footer-meta">Spring / Summer 2026</span>
      <span class="footer-copy">&copy; 2026</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
