<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lollipop's Lookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./formal.css">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
</head>
<body>

  <!-- ───────────── HEADER ───────────── -->
  <header class="site-header">
    <a href="index.html" class="logo">LOLLIPOP<sup>&reg;</sup></a>
    <nav class="site-nav">
      <a href="index.html#looks">LOOKS</a>
      <a href="index.html#about">ABOUT</a>
      <!--a href="index.html#looks">CONTACT</a-->
    </nav>
  </header>

<!-- The main canvas holding the layout -->
  <div class="lookbook-canvas">
    
    <!-- Background / Largest Image Window -->
    <div class="window bg-window">
      <div class="window-bar">
        <div class="circles"><span></span><span></span><span></span></div>
      </div>
      <div class="window-content">
        <img src="./assets/formal 2.jpg" alt="Background macro detail view">
      </div>
    </div>

    <!-- Top Left Window (Portrait Close-up) -->
    <div class="window window-top-left">
      <div class="window-bar">
        <div class="circles"><span></span><span></span><span></span></div>
      </div>
      <div class="window-content">
        <img src="./assets/formal 3.jpg" alt="Model portrait view">
      </div>
    </div>

    <!-- Bottom Right Window (Full Length/Shoes) -->
    <div class="window window-bottom-right">
      <div class="window-bar">
        <div class="circles"><span></span><span></span><span></span></div>
      </div>
      <div class="window-content">
        <img src="./assets/formal 1.jpg" alt="Model full length view">
      </div>
    </div>

  </div>

  <!-- ───────────── FOOTER ───────────── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">LOLLIPOP</span>
      <!--span class="footer-meta">Spring / Summer 2026</span-->
      <span class="footer-copy">&copy; 2026</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
