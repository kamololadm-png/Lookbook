<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lollipop's Lookbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Inter:wght@300;400;500&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./streetwear.css">
  <link rel="icon" type="image/x-icon" href="./assets/favicon.png">
</head>
<body>

 <!-- ───────────── HEADER ───────────── -->
<header class="site-header">
    <div class="header-inner">
      <!--span class="film-logo">LOLLIPOP<sup>&reg;</sup></span-->
      <a href="#" class="logo">LOLLIPOP<sup>&reg;</sup></a>
      <nav class="site-nav">
        <a href="#looks">Looks</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <!-- Horizontal gallery -->

    <main class="horizontal-gallery">
        <div class="collage">

            <img class="image image-1"
                 src="./assets/Streetwear 1.jpg"
                 alt="">

            <img class="image image-2"
                 src="./assets/Streetwear 2.jpg"
                 alt="">

            <img class="image image-3"
                 src="./assets/Streetwear 3.jpg"
                 alt="">

            <img class="image image-4"
                 src="./assets/Streetwear 4.jpg"
                 alt="">

            <img class="image image-5"
                 src="./assets/Streetwear 5.jpg"
                 alt="">

            <img class="image image-6"
                 src="./assets/Streetwear 6.jpg"
                 alt="">

            <img class="image image-7"
                 src="./assets/Streetwear 7.jpg"
                 alt="">

            <img class="image image-8"
                 src="./assets/Streetwear 8.jpg"
                 alt="">

            <img class="image image-9"
                 src="./assets/Streetwear 9.jpg"
                 alt="">

            <img class="image image-10"
                 src="./assets/Streetwear 10.jpg"
                 alt="">

            <img class="image image-11"
                 src="./assets/Streetwear 11.jpg"
                 alt="">
        </div>
    </main>


    <!-- Zoom -->
    <div class="lightbox" id="lightbox">
        <button class="close" id="close">
            &times;
        </button>
        <img id="zoomedImage" src="" alt="">
    </div>


  <!-- ───────────── FOOTER ───────────── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-logo">LOLLIPOP</span>
      <!--span class="footer-meta">Spring / Summer 2026</span-->
      <span class="footer-copy">&copy; 2026</span>
    </div>
  </footer>

  <script src="./streetwear.js"></script>
</body>
</html>
